<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="barGradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="softShadowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4ED8" flood-opacity="0.28"/>
    </filter>
    <filter id="barShadowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#bgGradBlue)" filter="url(#softShadowBlue)"/>

  <!-- shine highlight top -->
  <ellipse cx="180" cy="110" rx="140" ry="60" fill="#FFFFFF" opacity="0.18"/>
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M 400 90 L 406 104 L 420 110 L 406 116 L 400 130 L 394 116 L 380 110 L 394 104 Z"/>
    <circle cx="90" cy="150" r="6"/>
  </g>

  <!-- Connecting cable between servers -->
  <g>
    <path d="M 356 220 Q 380 227 356 234" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M 356 322 Q 380 328 356 330" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="356" cy="220" r="6" fill="#1D4ED8"/>
    <circle cx="356" cy="234" r="6" fill="#1D4ED8"/>
    <circle cx="356" cy="322" r="6" fill="#1D4ED8"/>
    <circle cx="356" cy="330" r="6" fill="#1D4ED8"/>
  </g>

  <!-- Server stack: 3 chunky rounded bars -->
  <g filter="url(#barShadowBlue)">
    <!-- Top bar -->
    <rect x="120" y="140" width="272" height="80" rx="30" fill="url(#barGradBlue)"/>
    <circle cx="160" cy="180" r="11" fill="#3B82F6"/>
    <rect x="192" y="171" width="64" height="18" rx="9" fill="#BFDBFE"/>

    <!-- Middle bar -->
    <rect x="120" y="234" width="272" height="88" rx="34" fill="url(#barGradBlue)"/>
    <circle cx="160" cy="278" r="11" fill="#3B82F6"/>
    <rect x="192" y="269" width="64" height="18" rx="9" fill="#BFDBFE"/>

    <!-- Bottom bar -->
    <rect x="120" y="330" width="272" height="80" rx="30" fill="url(#barGradBlue)"/>
    <circle cx="160" cy="370" r="11" fill="#3B82F6"/>
    <rect x="192" y="361" width="64" height="18" rx="9" fill="#BFDBFE"/>
  </g>
</svg>
