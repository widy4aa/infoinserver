[package]
name = "infoinserver"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-auth = "0.8.1"
jsonwebtoken = "9"
libc = "0.2"
pam = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono"] }
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["fs", "full", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }
